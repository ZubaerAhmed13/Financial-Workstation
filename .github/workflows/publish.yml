name: Publish Financial Workstation

on:
  push:
    paths:
      - '.publish-ready'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact HTML
        shell: bash
        run: |
          cat chunks/part-*.b64 > /tmp/financial-workstation.xz.b64
          base64 --decode /tmp/financial-workstation.xz.b64 > /tmp/financial-workstation.html.xz
          xz --decompress --stdout /tmp/financial-workstation.html.xz > index.html
          echo "8168f7b81f82a74710d92f8ddc70dc71ff149841eae65d4668fd49c4d4cfe29c  index.html" | sha256sum -c -

      - name: Commit exact site file and remove transfer chunks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r chunks .publish-ready
          git commit -m "Publish exact Financial Workstation [skip ci]"
          git push

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
