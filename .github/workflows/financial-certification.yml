name: Financial Calculation Certification

on:
  push:
    branches: [main, full-calculation-surface-retirement]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Fresh dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Normalize separate canonical UI source
        run: node scripts/strip-generated-runtime.js src/ui/workstation.html

      - name: Syntax validation
        run: |
          node -c src/finance/engine.js
          node -c src/finance/model-engine.js
          node -c src/finance/legacy-hardening.js
          node -c src/finance/risk-credit-core.js
          node -c src/finance/workstation-core.js
          node -c src/finance/workstation-ledger-core.js
          node -c src/finance/simulation-backtest-core.js
          node -c src/finance/surface-retirement-core.js
          node -c src/finance/calculation-registry.js
          node -c src/runtime/production-routing-manifest.js
          node -c src/runtime/install.js
          node -c src/runtime/install-workstation.js
          node -c src/runtime/install-surface-retirement.js
          node -c scripts/build.js
          node -c scripts/strip-generated-runtime.js
          node -c scripts/build-purity-audit.js
          node -c scripts/calculation-surface-audit.js
          node -c scripts/generate-calculation-governance.js
          node -c scripts/verify-build.js
          node -c scripts/verify-workstation-build.js
          node -c scripts/static-audit.js
          node -c scripts/contextual-audit.js
          node -c scripts/certified-core-audit.js
          node -c scripts/workstation-core-audit.js
          node -c scripts/legacy-calculation-inventory.js
          node -c scripts/focused-math-inventory.js
          node -c tests/browser-smoke.js
          node -c tests/workstation-browser-smoke.js
          node -c tests/surface-retirement-core.test.js
          node -c tests/calculation-governance.test.js

      - name: Certified calculation source gate
        run: node scripts/certified-core-audit.js

      - name: Workstation ownership source gate
        run: node scripts/workstation-core-audit.js

      - name: Zero financial build patch gate
        run: node scripts/build-purity-audit.js

      - name: Full calculation surface classification
        run: node scripts/calculation-surface-audit.js src/ui/workstation.html --write=docs/CALCULATION_SURFACE_CLASSIFICATION.md

      - name: Financial unit regression known-answer and integration tests
        run: npm test

      - name: Production single-file build
        run: npm run build

      - name: Financial danger-pattern count audit
        run: node scripts/static-audit.js dist/index.html

      - name: Contextual disposition of all static-audit leads
        run: node scripts/contextual-audit.js dist/index.html --write=docs/STATIC_AUDIT_FINDINGS.md

      - name: Generate canonical legacy calculation inventory
        run: node scripts/legacy-calculation-inventory.js src/ui/workstation.html --write=docs/LEGACY_CALCULATION_INVENTORY.md

      - name: Generate focused canonical math inventories
        run: node scripts/focused-math-inventory.js src/ui/workstation.html

      - name: Production artifact verification
        run: node scripts/verify-build.js

      - name: Final workstation production artifact verification
        run: node scripts/verify-workstation-build.js

      - name: Generate registry routing and legacy retirement reports
        run: node scripts/generate-calculation-governance.js

      - name: Install pinned cross-browser smoke-test runtime
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Chromium desktop workstation smoke pass
        run: node tests/browser-smoke.js dist/index.html --browser=chromium --viewport=desktop --write=docs/BROWSER_SMOKE_REPORT.json

      - name: Firefox desktop workstation smoke pass
        run: node tests/browser-smoke.js dist/index.html --browser=firefox --viewport=desktop --write=docs/BROWSER_SMOKE_FIREFOX.json

      - name: WebKit desktop workstation smoke pass
        run: node tests/browser-smoke.js dist/index.html --browser=webkit --viewport=desktop --write=docs/BROWSER_SMOKE_WEBKIT.json

      - name: Chromium mobile responsive smoke pass
        run: node tests/browser-smoke.js dist/index.html --browser=chromium --viewport=mobile --write=docs/BROWSER_SMOKE_MOBILE.json

      - name: Chromium desktop final calculation routes
        run: node tests/workstation-browser-smoke.js dist/index.html --browser=chromium --viewport=desktop --write=docs/WORKSTATION_BROWSER_CHROMIUM.json

      - name: Firefox desktop final calculation routes
        run: node tests/workstation-browser-smoke.js dist/index.html --browser=firefox --viewport=desktop --write=docs/WORKSTATION_BROWSER_FIREFOX.json

      - name: WebKit desktop final calculation routes
        run: node tests/workstation-browser-smoke.js dist/index.html --browser=webkit --viewport=desktop --write=docs/WORKSTATION_BROWSER_WEBKIT.json

      - name: Chromium mobile final calculation routes
        run: node tests/workstation-browser-smoke.js dist/index.html --browser=chromium --viewport=mobile --write=docs/WORKSTATION_BROWSER_MOBILE.json

      - name: Generate deployable root on retirement branch
        if: github.event_name == 'push' && github.ref_name == 'full-calculation-surface-retirement'
        run: npm run build:root

      - name: Commit canonical source certification evidence and single-file artifacts
        if: github.event_name == 'push' && github.ref_name == 'full-calculation-surface-retirement'
        shell: bash
        run: |
          git add src/ui/workstation.html index.html dist/index.html \
            docs/CALCULATION_SURFACE_CLASSIFICATION.md docs/CALCULATION_REGISTRY.md docs/PRODUCTION_ROUTING_MANIFEST.md docs/LEGACY_RETIREMENT_REPORT.md \
            docs/STATIC_AUDIT_FINDINGS.md docs/LEGACY_CALCULATION_INVENTORY.md docs/FOCUSED_MATH_ANALYTICS.md docs/FOCUSED_MATH_WORKSPACE.md docs/FOCUSED_MATH_PORTFOLIO.md \
            docs/BROWSER_SMOKE_REPORT.json docs/BROWSER_SMOKE_FIREFOX.json docs/BROWSER_SMOKE_WEBKIT.json docs/BROWSER_SMOKE_MOBILE.json \
            docs/WORKSTATION_BROWSER_CHROMIUM.json docs/WORKSTATION_BROWSER_FIREFOX.json docs/WORKSTATION_BROWSER_WEBKIT.json docs/WORKSTATION_BROWSER_MOBILE.json
          if git diff --cached --quiet; then
            echo "Generated artifacts and governance evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh full calculation retirement evidence [cert-build]"
          git push origin HEAD:${GITHUB_REF_NAME}
